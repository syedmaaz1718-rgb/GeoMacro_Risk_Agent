services:
  db:
    image: postgres:16
    environment: {POSTGRES_DB: geomacro, POSTGRES_USER: geomacro, POSTGRES_PASSWORD: geomacro}
    volumes: [db_data:/var/lib/postgresql/data]
  app:
    build: .
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql://geomacro:geomacro@db:5432/geomacro
    ports: ["8080:8080"]
    depends_on: [db]
volumes:
  db_data:
