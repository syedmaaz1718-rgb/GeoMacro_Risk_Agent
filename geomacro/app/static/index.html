<html lang="en" data-theme="obsidian"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Geo-Macro Risk Agent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--r:18px;--serif:'Fraunces',Georgia,serif;--sans:'Inter',system-ui,sans-serif;--mono:'JetBrains Mono',ui-monospace,monospace}
[data-theme=obsidian]{--bg:#0b0c0f;--bg2:#101217;--card:#14161c;--line:#232733;--ink:#f2efe8;--mute:#8b90a0;--accent:#f5b544;--glow:rgba(245,181,68,.12);
 --normal:#46d39a;--caution:#f5b544;--high:#ff7a45;--avoid:#ff4d5e;--map:dark}
[data-theme=aurora]{--bg:#0a0820;--bg2:#100d2e;--card:rgba(255,255,255,.055);--line:rgba(255,255,255,.12);--ink:#f4f1ff;--mute:#a49fc7;--accent:#7cf3d0;--glow:rgba(124,243,208,.14);
 --normal:#5cf2b8;--caution:#ffd166;--high:#ff8fab;--avoid:#ff4f8b;--map:dark}
[data-theme=ivory]{--bg:#f6f2ea;--bg2:#efe9dd;--card:#fffdf8;--line:#e3dccd;--ink:#1c1b19;--mute:#7a7467;--accent:#c2410c;--glow:rgba(194,65,12,.07);
 --normal:#0f9d6b;--caution:#c98a0b;--high:#d9541e;--avoid:#c81e3a;--map:light}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--sans);min-height:100vh;-webkit-font-smoothing:antialiased}

[data-theme=obsidian] body{background:radial-gradient(900px 500px at 50% -20%,var(--glow),transparent),var(--bg)}
.wrap{max-width:1280px;margin:0 auto;padding:28px 32px 64px}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px}
.brand{display:flex;gap:12px;align-items:center;font-weight:600;letter-spacing:.2px}
.logo{width:30px;height:30px;border-radius:9px;background:conic-gradient(from 210deg,var(--normal),var(--caution),var(--high),var(--avoid),var(--normal));position:relative}
.logo:after{content:'';position:absolute;inset:7px;border-radius:50%;background:var(--bg)}
.brand small{display:block;font-weight:400;color:var(--mute);font-size:12px;letter-spacing:0}
.tools{display:flex;gap:10px;align-items:center;color:var(--mute);font-size:12px}
.pill{border:1px solid var(--line);border-radius:99px;padding:5px 12px;background:var(--card);display:inline-flex;gap:7px;align-items:center;color:var(--mute);font-size:12px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--normal);box-shadow:0 0 0 0 var(--normal);animation:pulse 2s infinite}
.dot.bad{background:var(--avoid);animation:none}
@keyframes pulse{70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}
.sw{display:flex;gap:6px}.sw button{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);cursor:pointer}
.sw button.on{border-color:var(--ink)}
.hero{display:grid;grid-template-columns:1.15fr 1fr;gap:20px;margin-bottom:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:22px;backdrop-filter:blur(14px)}
.eyebrow{font:500 11px var(--mono);letter-spacing:1.6px;text-transform:uppercase;color:var(--mute)}
.stance{display:flex;align-items:center;gap:28px}
.gauge{position:relative;width:170px;height:170px;flex:none}
.gauge svg{transform:rotate(-90deg)}
.gauge .n{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font:600 54px var(--serif);line-height:1}
.gauge .n small{display:block;font:500 11px var(--mono);color:var(--mute);margin-top:6px;letter-spacing:1px}
.big{font:600 44px/1.05 var(--serif);letter-spacing:-.5px;margin:8px 0 8px}
.lead{color:var(--mute);max-width:46ch}
.market{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.tile .v{font:600 34px var(--serif);margin:6px 0 2px}
.tile .d{font:500 13px var(--mono)}
.up{color:var(--high)}.dn{color:var(--normal)}
.tile .s{color:var(--mute);font-size:12px;margin-top:8px}
.regions{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-bottom:20px}
.rc{position:relative;overflow:hidden}
.rc:before{content:'';position:absolute;left:0;top:0;right:0;height:3px;background:var(--c)}
.rc .top{display:flex;justify-content:space-between;align-items:flex-start}
.rc h3{font:600 20px/1.2 var(--serif);max-width:15ch}
.badge{font:600 11px var(--mono);letter-spacing:1px;padding:4px 10px;border-radius:99px;color:var(--bg);background:var(--c)}
.rc .sc{font:600 64px/1 var(--serif);margin:18px 0 2px}.rc .sc small{font:400 14px var(--mono);color:var(--mute)}
.spark{width:100%;height:46px;margin:6px 0 12px}
.chips{display:flex;flex-wrap:wrap;gap:6px;min-height:28px}
.chip{font-size:12px;padding:4px 10px;border-radius:99px;border:1px solid var(--line);background:var(--bg2)}
.chip b{color:var(--c);font-weight:600}
.counts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px;border-top:1px solid var(--line);padding-top:14px}
.counts div{font:600 20px var(--serif)}.counts span{display:block;font:400 10.5px var(--mono);color:var(--mute);letter-spacing:.5px;text-transform:uppercase}
.row{display:grid;grid-template-columns:1.4fr 1fr;gap:20px;margin-bottom:20px}
#map{height:380px;border-radius:12px;margin-top:14px;background:var(--bg2)}
.leaflet-container{font-family:var(--sans)}
.tiles-dark{filter:invert(1) hue-rotate(180deg) brightness(.72) contrast(.9) saturate(.5)}.tiles-light{filter:saturate(.6) sepia(.15)}
.leaflet-control-zoom a{background:var(--card)!important;color:var(--ink)!important;border-color:var(--line)!important}

.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
.tl{margin-top:14px;display:flex;flex-direction:column}
.al{padding:12px 0;border-top:1px solid var(--line);display:flex;gap:12px;cursor:pointer}
.al:first-child{border-top:0}
.al .b{flex:none;width:8px;border-radius:4px;background:var(--c)}
.al h4{font-size:13.5px;font-weight:600}.al p{color:var(--mute);font-size:12px;margin-top:2px}
.empty{color:var(--mute);padding:26px 4px;font-size:13px;line-height:1.6}
.news a{display:block;padding:10px 0;border-top:1px solid var(--line);color:var(--ink);text-decoration:none;font-size:13px}
.news a:first-child{border-top:0}.news a:hover{color:var(--accent)}.news span{display:block;color:var(--mute);font:400 11px var(--mono);margin-top:3px}
.feeds{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-top:14px}
.feed{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--bg2)}
.feed b{display:flex;gap:8px;align-items:center;font-weight:600}.feed small{display:block;color:var(--mute);font:400 11px var(--mono);margin-top:6px}
.how{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-top:14px}
.w{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--bg2)}.w b{font:600 22px var(--serif)}.w span{display:block;color:var(--mute);font-size:11.5px;margin-top:2px}
footer{color:var(--mute);font-size:12px;margin-top:28px;text-align:center;line-height:1.7}
dialog{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:var(--r);max-width:640px;width:92%;padding:26px}
dialog::backdrop{background:#0009}
dialog pre{white-space:pre-wrap;font:12.5px/1.6 var(--mono);color:var(--ink);background:var(--bg2);padding:14px;border-radius:12px;margin:12px 0}
dialog button{background:var(--ink);color:var(--bg);border:0;border-radius:99px;padding:8px 18px;cursor:pointer;font-weight:600}
.ev{font:12px var(--mono);color:var(--mute);margin:3px 0}
@media(max-width:980px){.hero,.row,.regions{grid-template-columns:1fr}.how{grid-template-columns:repeat(3,1fr)}.stance{flex-direction:column;align-items:flex-start}.wrap{padding:18px}}

body{display:block}
.app{display:grid;grid-template-columns:236px 1fr;min-height:100vh}
nav.side{position:sticky;top:0;height:100vh;padding:22px 14px;border-right:1px solid var(--line);background:linear-gradient(180deg,var(--bg2),transparent);display:flex;flex-direction:column;gap:4px}
nav.side .brand{padding:4px 10px 22px}

nav.side a svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;transition:.3s}
nav.side a:hover{color:var(--ink);background:var(--card)}nav.side a:hover svg{transform:scale(1.15) rotate(-4deg)}
nav.side a.on{color:var(--ink);background:var(--card);box-shadow:inset 0 0 0 1px var(--line)}
nav.side a.on:before{content:'';position:absolute;left:-14px;top:10px;bottom:10px;width:3px;border-radius:3px;background:var(--accent)}
nav.side .grp{font:500 10px var(--mono);letter-spacing:1.6px;color:var(--mute);padding:16px 12px 6px;text-transform:uppercase}
nav.side .foot{margin-top:auto;display:flex;flex-direction:column;gap:10px;padding:10px}
main#view{padding:30px 38px 70px;max-width:1260px;width:100%;min-width:0}
.enter{animation:enter .55s cubic-bezier(.2,.8,.2,1) both}
@keyframes enter{from{opacity:0;transform:translateY(16px) scale(.992);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
.stag>*{animation:enter .6s cubic-bezier(.2,.8,.2,1) both}.stag>*:nth-child(2){animation-delay:.06s}.stag>*:nth-child(3){animation-delay:.12s}.stag>*:nth-child(4){animation-delay:.18s}.stag>*:nth-child(5){animation-delay:.24s}
h1{font:600 34px var(--serif);letter-spacing:-.4px;margin:2px 0 4px}.sub{color:var(--mute);margin-bottom:24px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-bottom:20px}
table{width:100%;border-collapse:collapse;font-size:13px}th{font:500 10.5px var(--mono);letter-spacing:1.2px;text-transform:uppercase;color:var(--mute);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:top}tr.click{cursor:pointer}tr.click:hover td{background:var(--bg2)}
select,input[type=password],input[type=text]{background:var(--bg2);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font:inherit}
.bar{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;align-items:center}
.chart{width:100%;height:210px}
.kv{display:grid;grid-template-columns:200px 1fr;gap:8px 16px;font-size:13px}.kv b{color:var(--mute);font-weight:500}
.mapfull{height:calc(100vh - 150px);min-height:480px;border-radius:14px}
#login{position:fixed;inset:0;display:none;place-items:center;background:var(--bg);z-index:50}
#login .box{width:min(380px,90vw);text-align:center}
#login input{width:100%;margin:18px 0 10px;padding:12px 14px}
.btn{background:var(--ink);color:var(--bg);border:0;border-radius:99px;padding:10px 20px;font-weight:600;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.step{display:flex;gap:14px;padding:14px 0;border-top:1px solid var(--line)}.step:first-child{border-top:0}.step i{font:600 22px var(--serif);color:var(--accent);font-style:normal;width:28px}
.noanim *{animation:none!important;transition:none!important}
.frow{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:10px 0;border-bottom:1px solid var(--line)}.frow b{font-weight:500;font-size:13px;display:block}.frow small{color:var(--mute);font-size:11.5px}
.fin{display:flex;gap:6px}.num{width:74px;background:var(--bg);border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:7px 9px;font:13px var(--mono);text-align:right}.num:focus{outline:1px solid var(--accent)}.fin.chg .num{border-color:var(--accent)}
.sw{font-size:13px;color:var(--mute)}#toast{position:fixed;bottom:26px;left:50%;transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;font-weight:600;font-size:13px;opacity:0;transition:.25s;z-index:99}#toast.show{opacity:1;transform:translate(-50%,0)}
.rng{accent-color:var(--accent)}.sg{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:14px}.seg{display:inline-flex;border:1px solid var(--line);border-radius:99px;padding:3px;gap:2px}.seg button{background:none;border:0;color:var(--mute);padding:7px 16px;border-radius:99px;cursor:pointer;font:600 13px var(--sans,inherit)}.seg button.on{background:var(--ink);color:var(--bg)}
.legs{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:18px}.leg{border:1px solid var(--line);border-radius:14px;padding:14px}.leg small{font:500 10.5px var(--mono);letter-spacing:1.2px;color:var(--mute);text-transform:uppercase;display:block}.leg b{font:600 26px var(--serif,inherit);display:block;margin-top:4px}.leg i{font-style:normal;font-size:12px;color:var(--mute)}
@media(max-width:900px){.sg,.legs{grid-template-columns:1fr 1fr}}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{border:1px solid var(--line);background:none;color:var(--ink);border-radius:99px;padding:8px 14px;font:500 13px inherit;cursor:pointer;transition:.2s}.chip:hover,.chip.on{border-color:var(--accent);color:var(--accent)}
.tg{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px}.tg small{color:var(--mute);margin-left:8px}
.cmp{display:grid;grid-template-columns:1fr 60px 1fr;align-items:center;gap:10px;text-align:center}.cmp .arrow{font-size:28px;color:var(--mute)}.cmp .n{font:600 64px var(--serif,inherit);line-height:1}
.cb{display:flex;align-items:center;gap:10px;margin:7px 0;font-size:13px}.cb span{flex:0 0 190px;color:var(--mute)}.cb b{flex:0 0 40px;text-align:right}.cb i{flex:0 1 auto}.cb i{display:block;height:8px;border-radius:6px;background:var(--accent)}
.printonly{display:none}
@media print{nav.side,.bar button,.noprint,#toast,.seg,.chips,.btn{display:none!important}.printonly{display:block!important}html,body{background:#fff!important;color:#111!important}.app{display:block!important}main#view{padding:0!important;max-width:none!important}.card,.tile,.leg{background:#fff!important;border:1px solid #ccc!important;color:#111!important;break-inside:avoid;box-shadow:none!important}*{color:#111!important;-webkit-print-color-adjust:exact}h1,.big,.n,.v{color:#111!important}}
.bt{display:flex;align-items:flex-end;gap:26px;height:210px;padding:10px 6px 0;border-bottom:1px solid var(--line)}.bt .g{flex:1;display:flex;gap:6px;align-items:flex-end;height:100%;justify-content:center;position:relative}.bt .b{width:34%;border-radius:6px 6px 0 0;position:relative;min-height:2px}.bt .b em{position:absolute;top:-18px;left:0;right:0;text-align:center;font:500 11px var(--mono);font-style:normal;color:var(--ink)}
.btl{display:flex;gap:26px;padding:8px 6px;font:500 11px var(--mono);color:var(--mute);text-align:center}.btl div{flex:1}
@media(max-width:900px){.app{grid-template-columns:1fr}nav.side{position:fixed;bottom:0;top:auto;height:64px;width:100%;flex-direction:row;overflow:auto;z-index:20;padding:8px;border-top:1px solid var(--line);background:var(--bg)}nav.side .grp,nav.side .foot,nav.side .brand{display:none}nav.side a span{display:none}nav.side a{flex:none;padding:10px 14px}nav.side a svg{flex:none;width:20px;height:20px}nav.side a:hover{transform:none}main#view{padding:18px 16px 90px}.grid2,.grid3{grid-template-columns:1fr}.kv{grid-template-columns:1fr}}

input[type=checkbox]{appearance:none;-webkit-appearance:none;width:38px;height:22px;border-radius:99px;background:#23262f;border:1px solid var(--line);position:relative;cursor:pointer;transition:background .25s,border-color .25s;flex:none}
input[type=checkbox]::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#8a8f9c;transition:transform .28s cubic-bezier(.2,.8,.2,1),background .25s}
input[type=checkbox]:checked{background:color-mix(in srgb,var(--accent) 30%,#16181e);border-color:var(--accent)}
input[type=checkbox]:checked::after{transform:translateX(16px);background:var(--accent)}
input[type=range]{accent-color:var(--accent)}
select{cursor:pointer;transition:border-color .2s}select:hover{border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.cty{font:500 10px/14px var(--mono,monospace);letter-spacing:.14em;text-transform:uppercase;color:rgba(200,205,215,.38);text-align:center;pointer-events:none;white-space:nowrap}.leaflet-control-attribution{background:transparent!important;color:#6b7080!important;font-size:10px!important}.leaflet-control-attribution a{color:#8a8f9c!important}
/* ---- polish pass ---- */
::selection{background:color-mix(in srgb,var(--accent) 35%,transparent);color:#fff}
html{scroll-behavior:smooth}
body{font-feature-settings:"tnum" 1,"ss01" 1;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
*::-webkit-scrollbar{width:10px;height:10px}*::-webkit-scrollbar-thumb{background:#262932;border-radius:10px;border:2px solid transparent;background-clip:padding-box}*::-webkit-scrollbar-thumb:hover{background:#3a3e4a;background-clip:padding-box;border:2px solid transparent}
.card,.tile{transition:transform .35s cubic-bezier(.2,.7,.2,1),border-color .3s,box-shadow .35s,background .3s;position:relative}
.card:hover,.tile:hover{border-color:color-mix(in srgb,var(--accent) 28%,var(--line));box-shadow:0 18px 50px -24px color-mix(in srgb,var(--accent) 38%,transparent),0 1px 0 rgba(255,255,255,.04) inset}
a:hover>.card.rc{transform:translateY(-3px)}
.card::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(180deg,rgba(255,255,255,.035),transparent 38%);opacity:.9}
button,.btn{transition:transform .15s,background .2s,border-color .2s,box-shadow .25s}
button:active,.btn:active{transform:scale(.97)}
.btn:hover{box-shadow:0 10px 30px -12px color-mix(in srgb,var(--accent) 60%,transparent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:8px}
tr.click{transition:background .2s}tr.click:hover{background:rgba(255,255,255,.03)}
h1{letter-spacing:-.01em}
.empty{border:1px dashed var(--line);border-radius:14px;padding:26px;text-align:center}
.empty:not(:has(*)){background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.04) 50%,transparent 70%) 0 0/200% 100%;animation:shim 1.6s linear infinite}
@keyframes shim{to{background-position:-200% 0}}
.badge{box-shadow:0 0 0 1px color-mix(in srgb,var(--c) 40%,transparent) inset}

/* ---- motion ---- */
#view.enter{animation:enter .7s cubic-bezier(.2,.8,.2,1) both}
.bt .b{transform-origin:bottom;animation:grow .9s cubic-bezier(.2,.8,.2,1) both}.bt .g .b:nth-child(2){animation-delay:.08s}.bt .g:nth-child(2) .b{animation-delay:.12s}.bt .g:nth-child(3) .b{animation-delay:.24s}.bt .g:nth-child(4) .b{animation-delay:.36s}.bt .g:nth-child(5) .b{animation-delay:.48s}.bt .g:nth-child(6) .b{animation-delay:.6s}.bt .g:nth-child(7) .b{animation-delay:.72s}.bt .g:nth-child(8) .b{animation-delay:.84s}
@keyframes grow{from{transform:scaleY(0);opacity:.2}to{transform:none;opacity:1}}
path[pathLength]{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.5s .15s cubic-bezier(.3,.7,.2,1) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.ring circle:nth-child(2),.gauge circle:nth-child(2){animation:ringin 1.5s cubic-bezier(.3,.7,.2,1) both}
@keyframes ringin{from{stroke-dashoffset:1000}}
.badge{animation:pop .5s .15s cubic-bezier(.3,1.4,.4,1) both}
@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:none;opacity:1}}
.leaflet-marker-icon>*{animation:pop .7s cubic-bezier(.3,1.4,.4,1) both;transform-origin:center}.leaflet-marker-icon>svg{animation:pop .7s cubic-bezier(.3,1.4,.4,1) both}
tbody tr,table tr{animation:rowin .5s cubic-bezier(.2,.8,.2,1) both}
